name: Fit, check and publish

# Simulates the data, fits the models with nlmixr2, runs the static checks on
# the NONMEM control streams, and publishes a dashboard carrying real
# estimation diagnostics rather than only the simulation.
#
# The fit step is allowed to fail without failing the build: if nlmixr2
# cannot install or a model does not converge, the dashboard says so and
# falls back to showing the simulation, which is better than publishing
# nothing or pretending.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - run: ruff check .

      - name: Simulate the datasets and check the control streams
        run: |
          python -c "from pathlib import Path; from nmlib.build import generate_data; generate_data(Path('.'))"
          python -m nmlib.build --check

      - name: Tests
        run: pytest

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-nlmixr2-v1
          restore-keys: ${{ runner.os }}-nlmixr2-

      - name: Install nlmixr2
        id: install_r
        continue-on-error: true
        run: |
          Rscript -e 'install.packages(c("nlmixr2", "dplyr", "jsonlite"))'
          Rscript -e 'cat("nlmixr2", as.character(packageVersion("nlmixr2")), "\n")'

      - name: Fit the models
        id: fit
        continue-on-error: true
        run: Rscript fit/fit_nlmixr.R

      - name: What the fit produced
        run: ls -la fit/results/ 2>/dev/null || echo "no fit results"

      - name: Build the dashboard
        run: python -m nmlib.build --out site/index.html

      - name: The page is self-contained
        run: |
          python - <<'PY'
          import pathlib, re, sys
          html = pathlib.Path("site/index.html").read_text(encoding="utf-8")
          external = re.findall(r'(?:src|href)="(?!data:|#)([^"]+)"', html)
          bad = [u for u in external if not u.startswith("https://github.com/")]
          if bad:
              sys.exit(f"external references: {bad}")
          print(f"self-contained, {len(html)/1024:.0f} KB")
          PY

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
