name: Fit, check and publish

# One job, one toolchain. The datasets are simulated, the models are
# estimated, the control streams are checked statically and the dashboard is
# built -- all by `python -m nmlib.build`, the same command that runs on a
# laptop. There is no second language to install and nothing that is allowed
# to fail quietly: if estimation breaks, the build breaks, because a
# dashboard that silently falls back to showing only the simulation is worse
# than one that does not appear.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      # The figures name Inter first and fall back through the stack in
      # nmlib.theme. Installing it here is what keeps the published page
      # looking like the one built locally; if the package is unavailable the
      # fallbacks still render, so this step never fails the build.
      - name: Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter || \
            sudo apt-get install -y -qq fonts-liberation2 || true
          fc-cache -f >/dev/null 2>&1 || true

      - run: ruff check .

      - name: Tests
        run: pytest

      - name: Simulate, fit, check and build
        run: python -m nmlib.build --out site/index.html

      - name: Every parameter is accounted for
        run: |
          python - <<'PY'
          import json, pathlib, sys
          import pandas as pd
          from nmlib.diagnostics import recovery_rows

          results = pathlib.Path("fit/results")
          missed, total = [], 0
          for path in sorted(results.glob("*_estimates.csv")):
              rows = recovery_rows(pd.read_csv(path))
              total += len(rows)
              missed += [f"{path.stem}: {r.parameter}"
                         for r in rows.itertuples() if not r.covers]
              status = json.loads(
                  path.with_name(path.name.replace("_estimates.csv",
                                                   "_status.json"))
                  .read_text())
              print(f"{status['model']:24s} OFV {status['objective']:12.2f}  "
                    f"{status['seconds']:6.1f}s  {status['method']}")
          print(f"\n{total - len(missed)} of {total} parameters recovered "
                "within a 95% interval")
          # Not a failure: a wide design can legitimately miss one. It is
          # printed so a regression shows up in the log rather than only on
          # the page.
          for m in missed:
              print(f"  interval misses the simulated value: {m}")
          if total == 0:
              sys.exit("no estimates were produced")
          PY

      - name: The page is self-contained
        run: |
          python - <<'PY'
          import pathlib, re, sys
          html = pathlib.Path("site/index.html").read_text(encoding="utf-8")
          external = re.findall(r'(?:src|href)="(?!data:|#)([^"]+)"', html)
          bad = [u for u in external if not u.startswith("https://github.com/")]
          if bad:
              sys.exit(f"external references: {bad}")
          print(f"self-contained, {len(html) / 1024:.0f} KB")
          PY

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
