[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nmlib"
version = "0.1.0"
description = "NONMEM control streams for common industry model types, with simulated data and a results dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Wen Rui Tan" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
nmlib = "nmlib.build:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nmlib"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
